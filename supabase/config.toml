project_id = "open-chess"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173/chess_client.html"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  "http://localhost:8000/**",
  "http://127.0.0.1:8000/**",
  "http://localhost:8080/**",
  "http://127.0.0.1:8080/**",
  "http://localhost:5500/**",
  "http://127.0.0.1:5500/**",
  "http://localhost:*/**",
  "http://127.0.0.1:*/**"
]

[functions.submit-ranked-result]
verify_jwt = true
